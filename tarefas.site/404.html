<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Redirecionando...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages - Redirecionamento 100% Limpo por sessionStorage
      var l = window.location;
      var pathSegments = l.pathname.split('/').filter(Boolean);

      if (pathSegments.length > 0) {
        var rootProject = '';
        var remainingPath = '';

        if (pathSegments.length > 1) {
          // Se houver mais de um segmento (ex: /loja/dashboard), o primeiro é a pasta do projeto (raiz)
          rootProject = pathSegments[0];
          remainingPath = '/' + pathSegments.slice(1).join('/');
        } else {
          // Se houver apenas um segmento (ex: /dashboard), a raiz é o próprio domínio principal (jeffmr.github.io)
          rootProject = '';
          remainingPath = '/' + pathSegments[0];
        }

        var storageKey = rootProject ? 'ghpages_redirect_' + rootProject : 'ghpages_redirect_root';
        
        try {
          sessionStorage.setItem(storageKey, JSON.stringify({
            path: remainingPath,
            search: l.search || '',
            hash: l.hash || ''
          }));
        } catch (e) {}

        // Redireciona de forma limpa para a pasta raiz correspondente
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + (rootProject ? rootProject + '/' : ''));
      }
    </script>
  </head>
  <body>
  </body>
</html>
