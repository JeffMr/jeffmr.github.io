<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Redirecionando...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages SPA Redirect - Dinâmico e Isolado por Projeto
      var l = window.location;
      var pathSegments = l.pathname.split('/').filter(Boolean);

      if (pathSegments.length > 0) {
        var rootProject = pathSegments[0];
        var remainingPath = pathSegments.slice(1).join('/');

        // Trava de segurança contra loops acidentais específica do projeto identificado
        if (l.search && l.search.indexOf('~and~') !== -1 && l.search.indexOf('?') !== -1) {
          window.location.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + rootProject + '/');
        } else {
          var searchParams = l.search ? (remainingPath ? '&' : '') + l.search.slice(1).replace(/&/g, '~and~') : '';

          l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            '/' + rootProject + '/' +
            remainingPath.replace(/&/g, '~and~') +
            searchParams +
            l.hash
          );
        }
      }
    </script>
  </head>
  <body>
  </body>
</html>
