<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Tarefas.site - Redirecionando...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages SPA Redirect
      var l = window.location;
      var pathSegments = l.pathname.split('/').filter(Boolean);
      var rootProject = pathSegments[0] || 'tarefas-site';
      var remainingPath = pathSegments.slice(1).join('/');

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/' + rootProject + '/?/' +
        remainingPath.replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
