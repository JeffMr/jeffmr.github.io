<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Tarefas.site - Redirecionando...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages SPA Redirect
      var l = window.location;
      
      // Trava de segurança contra loops acidentais
      if (l.search && l.search.indexOf('~and~') !== -1 && l.search.indexOf('?') !== -1) {
        // Se já houver sinal de codificação múltipla, vai direto para a raiz limpa do app
        window.location.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/tarefas.site/');
      } else {
        var pathSegments = l.pathname.split('/').filter(Boolean);
        var rootProject = 'tarefas.site';
        var remainingPath = '';

        if (pathSegments.length > 0) {
          if (pathSegments[0] === 'tarefas.site' || pathSegments[0] === 'tarefas-site') {
            remainingPath = pathSegments.slice(1).join('/');
          } else {
            // Caso a rota tenha sido requisitada na raiz (ex: /task-viewer), direciona para dentro de /tarefas.site/
            remainingPath = pathSegments.join('/');
          }
        }

        var searchParams = l.search ? (remainingPath ? '&' : '') + l.search.slice(1).replace(/&/g, '~and~') : '';

        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/' + rootProject + '/?/' +
          remainingPath.replace(/&/g, '~and~') +
          searchParams +
          l.hash
        );
      }
    </script>
  </head>
  <body>
  </body>
</html>
